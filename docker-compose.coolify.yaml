# WebXLR8 deployment of textbee on Coolify (https://textbee.wx8.org).
#
# Routing (set in Coolify, not here):
#   textbee-web  -> https://textbee.wx8.org          (dashboard, NextAuth under /api/auth)
#   textbee-api  -> https://textbee.wx8.org/api/v1   (REST API used by the gateway phone and our backends)
# Path prefixes must NOT be stripped: the API itself serves /api/v1/*.
#
# Secrets come from Coolify: SERVICE_* values are generated by Coolify, FIREBASE_*
# (the "WebXLR8 SMS Gateway" project's service account) are set by hand.
# MongoDB and Redis have no public ports.

services:
  textbee-db:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${SERVICE_USER_MONGO}
      - MONGO_INITDB_ROOT_PASSWORD=${SERVICE_PASSWORD_MONGO}
      - MONGO_INITDB_DATABASE=textbee
    volumes:
      - textbee-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  textbee-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - textbee-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  textbee-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://${SERVICE_USER_MONGO}:${SERVICE_PASSWORD_MONGO}@textbee-db:27017/textbee?authSource=admin
      - REDIS_URL=redis://textbee-redis:6379
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - JWT_EXPIRATION=60d
      - FRONTEND_URL=https://textbee.wx8.org
      - APP_PUBLIC_URL=https://textbee.wx8.org
      - API_PUBLIC_URL=https://textbee.wx8.org/api/v1
      - EMAIL_LINK_SECRET=${SERVICE_PASSWORD_64_EMAILLINK}
      - USE_SMS_QUEUE=false
      - CLOUDFLARE_TURNSTILE_SECRET_KEY=${CLOUDFLARE_TURNSTILE_SECRET_KEY}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_PRIVATE_KEY_ID=${FIREBASE_PRIVATE_KEY_ID}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_CLIENT_ID=${FIREBASE_CLIENT_ID}
      - FIREBASE_CLIENT_C509_CERT_URL=${FIREBASE_CLIENT_C509_CERT_URL}
    depends_on:
      textbee-db:
        condition: service_healthy
      textbee-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  textbee-web:
    build:
      context: ./web
      dockerfile: Dockerfile.coolify
      args:
        - NEXT_PUBLIC_SITE_URL=https://textbee.wx8.org
        - NEXT_PUBLIC_API_BASE_URL=https://textbee.wx8.org/api/v1
        # Public site key of the Cloudflare Turnstile widget for textbee.wx8.org (the secret is a Coolify env var).
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAAGSXvbsyxoZzl8P5
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://textbee.wx8.org
      - NEXT_PUBLIC_API_BASE_URL=https://textbee.wx8.org/api/v1
      - NEXTAUTH_URL=https://textbee.wx8.org
      - NEXTAUTH_SECRET=${SERVICE_PASSWORD_64_NEXTAUTH}
    depends_on:
      - textbee-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  textbee-mongo:
  textbee-redis:
